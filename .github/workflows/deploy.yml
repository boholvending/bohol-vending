name: Deploy BOHOL website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Update and deploy website
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /var/www/bohol-vending
          test "$(whoami)" = "sicotcna03"
          git pull --ff-only origin main
          npm ci --include=dev
          npm run build
          if [ -f "$HOME/.config/bohol-vending/admin.env" ]; then
            set -a
            source "$HOME/.config/bohol-vending/admin.env"
            set +a
          fi
          pm2 restart bohol-vending --update-env
          pm2 save
          curl --fail --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1:3000/ --output /dev/null
